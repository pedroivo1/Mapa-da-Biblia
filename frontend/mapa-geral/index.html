<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa da História — Mapa da Bíblia</title>
    <meta name="description" content="Mapa geral do mundo antigo com linha do tempo: os povos e impérios de 2500 a.C. a hoje." />
    <meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icones/icone-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/compartilhado/css/base.css?v=10" />
    <link rel="stylesheet" href="/compartilhado/css/componentes.css?v=7" />
    <link rel="stylesheet" href="/mapa-geral/mapa-geral.css?v=3" />
    <script src="/compartilhado/js/tema.js"></script>
    <script>
      // dentro da linha do tempo: só o mapa e os controles do ano
      if (/[?&]embutido/.test(location.search)) document.documentElement.classList.add("embutido");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="/compartilhado/js/config.js"></script>
    <script src="/compartilhado/js/util.js"></script>
    <script src="/compartilhado/js/conta.js"></script>
    <script src="/compartilhado/js/projecao.js"></script>
    <script src="/mapa-geral/mapa-geral.js?v=6" defer></script>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="wordmark" href="/">
          <span class="mark" aria-hidden="true">B</span>
          Mapa da Bíblia
        </a>
        <nav class="nav-links" aria-label="Principal">
          <a class="nav-link hud" href="/biblia/"><span>Bíblia</span></a>
          <a class="nav-link hud" href="/plano-de-leitura/"><span>Plano de leitura</span></a>
          <a class="nav-link hud" href="/versiculos/"><span>Versículos</span></a>
          <a class="nav-link hud" href="/mapas/" aria-current="page"><span>Mapas</span></a>
          <a class="nav-link hud" href="/linha-do-tempo/"><span>Linha do tempo</span></a>
        </nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="frame mapa-pagina geral-pagina">
      <header class="biblia-topo">
        <h1>Mapa da <em>História.</em></h1>
      </header>

      <section id="geral" class="geral" aria-label="Mapa geral com linha do tempo">
        <div class="geral-quadro">
          <div id="geral-svg" class="geral-svg"></div>
          <div id="geral-cartao" class="geral-cartao" role="status" hidden></div>
        </div>
        <div class="geral-controle">
          <button type="button" id="geral-ant" aria-label="Ano anterior"></button>
          <button type="button" id="geral-play" aria-label="Reproduzir">&#9654;</button>
          <button type="button" id="geral-prox" aria-label="Próximo ano"></button>
          <input type="range" id="geral-ano" min="0" max="0" value="0" step="1" aria-label="Ano" />
          <output id="geral-rotulo" class="hud">&nbsp;</output>
          <label class="geral-vel hud faint"><span class="geral-vel-txt">Velocidade</span>
            <select id="geral-vel" aria-label="Velocidade da reprodução, em anos por segundo">
              <option value="5">5 anos/s</option>
              <option value="10" selected>10 anos/s</option>
              <option value="25">25 anos/s</option>
            </select>
          </label>
          <form class="geral-ir-form" action="#" autocomplete="off">
            <input type="text" id="geral-ir" class="hud" inputmode="numeric" placeholder="Ir para… 586 a.C." aria-label="Ir para o ano (ex.: 586 a.C. ou 30 d.C.)" />
          </form>
        </div>
        <p class="hud faint geral-nota" id="geral-nota"></p>
      </section>
    </main>
  </body>
</html>
