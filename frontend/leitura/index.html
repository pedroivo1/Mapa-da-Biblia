<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leitura — Mapa da Bíblia</title>
    <meta name="description" content="Marque os livros, capítulos e versículos que você já leu." />
    <meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icones/icone-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/compartilhado/css/base.css?v=11" />
    <link rel="stylesheet" href="/compartilhado/css/componentes.css?v=8" />
    <link rel="stylesheet" href="/leitura/leitura.css?v=1" />
    <script src="/compartilhado/js/tema.js"></script>
    <script>
      // só existe como popup do leitor: aberta direto, volta para a Bíblia
      if (!/[?&]embutido/.test(location.search)) location.replace("/biblia/");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="/compartilhado/js/config.js"></script>
    <script src="/compartilhado/js/util.js"></script>
    <script src="/compartilhado/js/conta.js"></script>
    <script src="/leitura/leitura.js" defer></script>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="wordmark" href="/">
          <span class="mark" aria-hidden="true">B</span>
          Mapa da Bíblia
        </a>
        <nav class="nav-links" aria-label="Principal">
          <a class="nav-link hud" href="/linha-do-tempo/"><span>Linha do tempo</span></a>
          <a class="nav-link hud" href="/biblia/"><span>Bíblia</span></a>
        </nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="frame">
      <header class="biblia-topo">
        <h1>Leitura.</h1>
        <p class="hud muted">Marque o que você já leu. O progresso fica na sua conta.</p>
      </header>

      <div class="progresso" aria-label="Progresso de leitura">
        <div data-progresso="livro"><span class="hud muted"></span><progress value="0" max="1"></progress></div>
        <div data-progresso="capitulo"><span class="hud muted"></span><progress value="0" max="1"></progress></div>
        <div data-progresso="versiculo"><span class="hud muted"></span><progress value="0" max="1"></progress></div>
      </div>

      <div id="leitura" class="leitura-pagina" aria-live="polite"><p class="vazio hud faint">Carregando…</p></div>
    </main>
  </body>
</html>
